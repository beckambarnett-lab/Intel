<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EMBER</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #07070a;
        color: #c8c4bd;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        top: 10px;
        left: 12px;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
        opacity: 0.85;
      }
      #banner {
        position: fixed;
        bottom: 12px;
        left: 12px;
        font-size: 12px;
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="banner">
      WASD move &middot; Shift sprint &middot; C creep &middot; add ?lag=200 to the URL to simulate
      latency
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
